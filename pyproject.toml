[project]
name = "anki-connect-server"
version = "0.2.0"
description = "Headless AnkiConnect-compatible REST API server with AnkiWeb sync"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "anki>=24.11",
    "python-multipart>=0.0.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "fastmcp>=3.1.0",
]

[project.scripts]
anki-connect-server = "anki_connect_server.cli:main"

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--cov=anki_connect_server --cov-report=term-missing --timeout=30"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "S",    # bandit (security)
    "T20",  # flake8-print
]
ignore = [
    "E501",  # line length handled by formatter
    "S101",  # assert in tests is fine
    "S105",  # hardcoded password string in tests is fine
    "S106",  # hardcoded password arg in tests is fine
    "B008",  # FastAPI Depends() in defaults is the framework convention
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "S110", "T201"]

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
venv = ".venv"
exclude = ["build", "dist", "**/.venv"]
# The anki Python package ships py.typed but its stubs are incomplete;
# many methods (Card.q/a, TagManager.add_tags, MediaManager.read_data,
# ImportAnkiPackageRequest) are not exposed to type checkers. Treat the
# anki-wrapper module leniently until upstream anki improves its stubs.
reportMissingImports = "warning"
reportMissingTypeStubs = "none"
reportArgumentType = "none"
reportCallIssue = "none"
reportOptionalMemberAccess = "none"
reportAttributeAccessIssue = "none"
reportReturnType = "none"

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "pyright>=1.1.380",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.0",
    "httpx>=0.27.0",
]