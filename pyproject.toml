[project]
name = "anki-connect-server"
version = "0.3.0"
description = "Headless AnkiConnect-compatible REST API server with AnkiWeb sync"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anki>=26.5",
    "fastapi>=0.139.2",
    "fastmcp>=3.4.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "uvicorn[standard]>=0.51.0",
]

[project.scripts]
anki-connect-server = "anki_connect_server.cli:main"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--cov=anki_connect_server --cov-report=term-missing --timeout=15"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
# Tests rely on pytest fixture injection (anki_wrapper, monkeypatch, caplog,
# tmp_path) where parameter types come from the fixtures, not annotations.
# Type the tests' control flow but don't require explicit annotations on
# every fixture parameter; pyright still checks source code under strict mode.
reportMissingParameterType = "none"
reportUnknownParameterType = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownLambdaType = "none"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "ASYNC",
    "B",
    "C4",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "LOG",
    "N",
    "PERF",
    "PIE",
    "PT",
    "PTH",
    "RET",
    "RUF",
    "S",
    "SIM",
    "T20",
    "UP",
]
ignore = ["N815"]  # AnkiConnect wire fields use camelCase

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "S110", "T201", "PTH", "PT018", "PT011", "RUF059", "SIM105", "SIM117"]

[tool.ruff.format]
docstring-code-format = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.22",
]